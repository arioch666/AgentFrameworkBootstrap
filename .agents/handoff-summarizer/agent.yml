id: handoff-summarizer
name: handoff-summarizer
purpose: "Creates concise handoff state between agents and across sessions."
inputs:
  - user_request
  - task_context
  - orchestration_context
outputs:
  - recommendations
  - actions
memory_path: .agents/handoff-summarizer/.memory/memory.md
agent_file: .agents/handoff-summarizer/agent.md
skills:
