id: kmp-debugging-advisor
name: kmp-debugging-advisor
purpose: "Suggests KMP debugging approaches and failure triage steps during execution."
inputs:
  - user_request
  - task_context
  - orchestration_context
outputs:
  - recommendations
  - actions
memory_path: .agents/kmp-debugging-advisor/.memory/memory.md
agent_file: .agents/kmp-debugging-advisor/agent.md
skills:
  shared:
    - .agents/.skills/spec-kit-workflow.md
  local:
    - .agents/.skills/kmp-debugging-guidance.md
triggers:
  - start_of_plan
  - end_of_plan
  - start_of_execution
  - end_of_execution
delegation_rules: []
