id: observer
name: observer
purpose: "Watches execution outcomes and proposes new agents, skills, and parallel patterns at end-of-run."
inputs:
  - user_request
  - task_context
  - orchestration_context
outputs:
  - recommendations
  - actions
memory_path: .agents/observer/.memory/memory.md
agent_file: .agents/observer/agent.md
skills:
  shared:
    - .agents/.skills/spec-kit-workflow.md
  local: []
triggers:
  - end_of_execution
delegation_rules: []
