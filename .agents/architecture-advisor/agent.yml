id: architecture-advisor
name: architecture-advisor
purpose: "Analyzes agent architecture and recommends flow/delegation improvements at end-of-plan."
inputs:
  - user_request
  - task_context
  - orchestration_context
outputs:
  - recommendations
  - actions
memory_path: .agents/architecture-advisor/.memory/memory.md
agent_file: .agents/architecture-advisor/agent.md
skills:
  shared:
    - .agents/.skills/spec-kit-workflow.md
  local: []
triggers:
  - end_of_plan
  - end_of_execution
delegation_rules: []
